
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q OG-1.zip -d source

      - name: Build APK
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found inside OG-1.zip"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: source/**/build/outputs/apk/**/*.apk
