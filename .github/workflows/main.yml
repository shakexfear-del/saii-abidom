
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project files
        run: |
          mkdir -p source
          unzip -q OG-1.zip -d source
          find source -type f -name '*.zip' -print0 | while IFS= read -r -d '' z; do
            mkdir -p "$(dirname "$z")/nested"
            unzip -oq "$z" -d "$(dirname "$z")/nested"
          done

      - name: Build APK
        run: |
          APP=$(find source -path '*/app/build.gradle' -print -quit)
          if [ -z "$APP" ]; then
            echo "Android app folder not found"
            find source -maxdepth 4 -type f
            exit 1
          fi
          PROJECT=$(dirname "$(dirname "$APP")")
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
